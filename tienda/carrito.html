<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

</head>

<body>

<header class="header">

<a href="index.html" class="logo">
<img src="img/logo.png" alt="UVAN BATTERY">
</a>

<nav>

<a href="catalogo.html">Catálogo</a>

</nav>

<section class="contenedor-carrito">

<h1>🛒 Mi carrito</h1>

<div id="listaCarrito"></div>

<div class="resumen">

<h2>Total</h2>

<h3 id="total">$0</h3>

<div class="datos-cliente">

<input
type="text"
id="nombreCliente"
placeholder="👤 Tu nombre">

<input
type="tel"
id="telefonoCliente"
placeholder="📞 Tu teléfono">

<input
type="text"
id="municipioCliente"
placeholder="📍 Municipio o alcaldía">

<label>
<input
type="checkbox"
id="instalacion">
Requiero instalación
</label>

</div>

<button class="comprar" id="finalizarCompra">
🟢 Finalizar pedido por WhatsApp
</button>

</div>
