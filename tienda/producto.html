<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Producto | UVAN BATTERY</title>

<link rel="stylesheet" href="css/style.css">

</head>
<body>

<header class="header">

<a href="index.html" class="logo">
<img src="img/logo.png" alt="UVAN BATTERY">
</a>

<nav>
<a href="index.html">Inicio</a>
<a href="catalogo.html">Catálogo</a>
<a href="carrito.html">Carrito</a>
</nav>

</header>

<main class="detalle-producto">

<div class="galeria">

<div class="imagen-principal">
<img id="imagenProducto" src="" alt="Producto">
</div>

<div class="miniaturas">
<img id="mini1" src="" class="mini activa">
<img id="mini2" src="" class="mini">
<img id="mini3" src="" class="mini">
</div>

</div>

<div class="info-producto">

<span class="marca" id="marcaProducto"></span>

<h1 id="modeloProducto"></h1>

<div class="estrellas">
⭐⭐⭐⭐⭐
<span>(4.9)</span>
</div>

<h2 class="precio" id="precioProducto"></h2>

<div class="badges">
<span>🚚 Envío Gratis</span>
<span>🛠 Instalación Disponible</span>
<span id="garantiaProducto"></span>
</div>

<p class="descripcion" id="descripcionProducto"></p>

<div class="cantidad">

<button>-</button>

<input type="number" value="1" min="1">

<button>+</button>

</div>

<button class="comprar">
Comprar ahora
</button>

<button class="carrito">
Agregar al carrito
</button>

</div>

</main>

<section class="especificaciones">

<h2>Especificaciones</h2>

<ul id="listaEspecificaciones">
</ul>

</section>

<section class="relacionados">

<h2>También te puede interesar</h2>

<div class="productos" id="productosRelacionados">

</div>

</section>

<footer>

<h3>UVAN BATTERY</h3>

<p>Expertos en baterías</p>

</footer>

<script src="js/productos.js"></script>
<script src="js/carrito.js"></script>
<script src="js/producto.js"></script>

</body>
</html>
